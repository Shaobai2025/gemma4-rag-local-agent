<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>知识库管理</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50 text-slate-800 min-h-screen"><div class="max-w-6xl mx-auto p-4 md:p-6"><div class="flex items-center justify-between mb-6"><div><h1 class="text-3xl font-bold">知识库管理</h1><p class="text-slate-500 mt-2">上传、替换、下载、查看详情、删除文档，并支持类别增删管理。</p></div><a href="/ask" class="rounded-xl bg-slate-900 text-white px-4 py-2">去工作台</a></div><section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm mb-6"><h2 class="text-xl font-semibold mb-4">类别管理</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-4"><label class="block"><span class="text-sm text-slate-600">类别键名</span><input id="newCategoryKey" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="如：employment"/></label><label class="block"><span class="text-sm text-slate-600">类别名称</span><input id="newCategoryLabel" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="如：就业工作"/></label><div class="flex items-end"><button id="addCategoryBtn" class="w-full rounded-xl bg-blue-600 text-white py-2.5 font-medium">新增类别</button></div></div><div id="categoryStatus" class="mt-3 text-sm"></div><div id="categoryList" class="mt-4 flex flex-wrap gap-2"></div></section><section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm mb-6"><div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center cursor-pointer"><div class="text-4xl mb-3">📂</div><p class="font-medium">拖拽文件到这里</p><p class="text-sm text-slate-500 mt-1">或点击选择文件</p><input id="fileInput" type="file" class="hidden" accept=".pdf,.docx,.md,.txt"/></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4"><label class="block md:col-span-2"><span class="text-sm text-slate-600">文档类别（可选）</span><select id="categoryInput" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2"></select></label><div class="flex items-end"><button id="uploadBtn" class="w-full rounded-xl bg-blue-600 text-white py-2.5 font-medium">上传 / 更新</button></div></div><div id="selectedFileBox" class="hidden mt-3 rounded-xl bg-slate-100 px-3 py-2 text-sm"></div><div id="uploadStatus" class="mt-4 text-sm"></div></section><section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm"><div class="flex items-center justify-between mb-4"><h2 class="text-xl font-semibold">文件列表</h2><button id="refreshFilesBtn" class="text-sm text-blue-600">刷新</button></div><div id="fileList" class="space-y-3"></div></section></div><div id="detailModal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-5"><div class="flex items-center justify-between mb-4"><h3 class="text-xl font-semibold">文件详情</h3><button id="closeDetailBtn" class="rounded-lg border px-3 py-1.5 text-sm">关闭</button></div><div id="detailContent" class="space-y-3 text-sm text-slate-700"></div></div></div><script>
const API_BASE="";const dropZone=document.getElementById("dropZone"),fileInput=document.getElementById("fileInput"),categoryInput=document.getElementById("categoryInput"),uploadBtn=document.getElementById("uploadBtn"),uploadStatus=document.getElementById("uploadStatus"),selectedFileBox=document.getElementById("selectedFileBox"),fileList=document.getElementById("fileList"),refreshFilesBtn=document.getElementById("refreshFilesBtn"),detailModal=document.getElementById("detailModal"),detailContent=document.getElementById("detailContent"),closeDetailBtn=document.getElementById("closeDetailBtn"),categoryList=document.getElementById("categoryList"),categoryStatus=document.getElementById("categoryStatus"),newCategoryKey=document.getElementById("newCategoryKey"),newCategoryLabel=document.getElementById("newCategoryLabel"),addCategoryBtn=document.getElementById("addCategoryBtn");let selectedFile=null,categories=[];function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function formatSize(b){return b<1024?`${b} B`:b<1024*1024?`${(b/1024).toFixed(1)} KB`:`${(b/1024/1024).toFixed(2)} MB`}function setUploadStatus(m,t="info"){const c={success:"text-green-600",error:"text-red-600",info:"text-slate-600"}[t]||"text-slate-600";uploadStatus.className=`mt-4 text-sm ${c}`;uploadStatus.textContent=m}function setCategoryStatus(m,t="info"){const c={success:"text-green-600",error:"text-red-600",info:"text-slate-600"}[t]||"text-slate-600";categoryStatus.className=`mt-3 text-sm ${c}`;categoryStatus.textContent=m}function updateSelectedFileUI(){selectedFile?(selectedFileBox.classList.remove("hidden"),selectedFileBox.textContent=`已选择：${selectedFile.name}（${formatSize(selectedFile.size)}）`):(selectedFileBox.classList.add("hidden"),selectedFileBox.textContent="")}function renderCategorySelect(){categoryInput.innerHTML='<option value="">自动识别</option>'+categories.map(c=>`<option value="${escapeHtml(c.key)}">${escapeHtml(c.label)} (${escapeHtml(c.key)})</option>`).join("")}function renderCategoryList(){categoryList.innerHTML=categories.map(c=>`<div class="inline-flex items-center gap-2 rounded-full bg-slate-100 border border-slate-200 px-3 py-1.5 text-sm"><span>${escapeHtml(c.label)} <span class="text-slate-400">(${escapeHtml(c.key)})</span></span>${c.key==="general"?"":`<button onclick="deleteCategory('${encodeURIComponent(c.key)}')" class="text-red-600 hover:text-red-700">删除</button>`}</div>`).join("")}async function loadCategories(){try{const resp=await fetch(`${API_BASE}/categories`),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"获取类别失败");categories=data.categories||[],renderCategorySelect(),renderCategoryList()}catch(err){setCategoryStatus(`加载类别失败：${err.message}`,"error")}}async function addCategory(){const key=newCategoryKey.value.trim(),label=newCategoryLabel.value.trim();if(!key||!label){setCategoryStatus("请先填写类别键名和类别名称","error");return}try{const resp=await fetch(`${API_BASE}/categories`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key,label})}),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"新增类别失败");categories=data.categories||[],renderCategorySelect(),renderCategoryList(),newCategoryKey.value="",newCategoryLabel.value="",setCategoryStatus("类别新增成功","success")}catch(err){setCategoryStatus(`新增类别失败：${err.message}`,"error")}}async function deleteCategory(encodedKey){const key=decodeURIComponent(encodedKey);if(!confirm(`确定删除类别「${key}」吗？`))return;try{const resp=await fetch(`${API_BASE}/categories/${encodedKey}`,{method:"DELETE"}),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"删除类别失败");categories=data.categories||[],renderCategorySelect(),renderCategoryList(),setCategoryStatus("类别删除成功","success")}catch(err){setCategoryStatus(`删除类别失败：${err.message}`,"error")}}async function loadFiles(){fileList.innerHTML='<div class="text-sm text-slate-500">正在加载文件列表...</div>';try{const resp=await fetch(`${API_BASE}/files`),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"获取文件列表失败");if(!data.files||data.files.length===0){fileList.innerHTML='<div class="text-sm text-slate-500">当前还没有上传文件。</div>';return}fileList.innerHTML=data.files.map(item=>`<div class="rounded-2xl border border-slate-200 p-4 bg-slate-50"><div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4"><div class="min-w-0"><div class="font-medium break-all">${escapeHtml(item.filename)}</div><div class="text-sm text-slate-500 mt-1">类别：${escapeHtml(item.category)} · 大小：${formatSize(item.size)} · 片段：${item.chunk_count}</div></div><div class="flex flex-wrap gap-2"><button onclick="replaceFile('${encodeURIComponent(item.filename)}')" class="rounded-lg border border-blue-200 text-blue-700 px-3 py-1.5 text-sm hover:bg-blue-50">替换更新</button><button onclick="downloadFile('${encodeURIComponent(item.filename)}')" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm hover:bg-white">下载原文件</button><button onclick="showDetail('${encodeURIComponent(item.filename)}')" class="rounded-lg border border-amber-200 text-amber-700 px-3 py-1.5 text-sm hover:bg-amber-50">查看详情</button><button onclick="deleteOneFile('${encodeURIComponent(item.filename)}')" class="rounded-lg border border-red-200 text-red-600 px-3 py-1.5 text-sm hover:bg-red-50">删除</button></div></div></div>`).join("")}catch(err){fileList.innerHTML=`<div class="text-sm text-red-600">加载失败：${escapeHtml(err.message)}</div>`}}async function uploadFile(fileOverride=null){const fileToUpload=fileOverride||selectedFile;if(!fileToUpload){setUploadStatus("请先选择一个文件。","error");return}uploadBtn.disabled=true,setUploadStatus("正在做文件级增量入库，请稍候...","info");try{const formData=new FormData();formData.append("file",fileToUpload),categoryInput.value&&formData.append("category",categoryInput.value);const resp=await fetch(`${API_BASE}/upload`,{method:"POST",body:formData}),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"上传失败");const action=data.updated?"已更新":"已新增";setUploadStatus(`${action}：${data.filename}，片段数 ${data.total_chunks}，类别 ${data.category}`,"success"),selectedFile=null,fileInput.value="",updateSelectedFileUI(),await loadFiles()}catch(err){setUploadStatus(`上传失败：${err.message}`,"error")}finally{uploadBtn.disabled=false}}async function deleteOneFile(encodedFilename){const filename=decodeURIComponent(encodedFilename);if(!confirm(`确定删除文件「${filename}」及其索引吗？`))return;try{const resp=await fetch(`${API_BASE}/files/${encodedFilename}`,{method:"DELETE"}),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"删除失败");setUploadStatus(`已删除：${data.filename}，移除片段 ${data.removed_chunks}`,"success"),await loadFiles()}catch(err){setUploadStatus(`删除失败：${err.message}`,"error")}}function downloadFile(encodedFilename){window.open(`${API_BASE}/files/${encodedFilename}/download`,"_blank")}async function showDetail(encodedFilename){try{const resp=await fetch(`${API_BASE}/files/${encodedFilename}/detail`),data=await resp.json();if(!resp.ok)throw new Error(data.detail||"获取详情失败");detailContent.innerHTML=`<div><span class="text-slate-500">文件名：</span>${escapeHtml(data.filename)}</div><div><span class="text-slate-500">大小：</span>${formatSize(data.size)}</div><div><span class="text-slate-500">类别：</span>${escapeHtml(data.category)}</div><div><span class="text-slate-500">Chunk 数：</span>${data.chunk_count}</div><div><span class="text-slate-500">文件 Hash：</span><span class="break-all">${escapeHtml(data.file_hash||"")}</span></div><div><div class="text-slate-500 mb-1">Chunk ID 预览：</div><div class="rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs leading-6 whitespace-pre-wrap">${escapeHtml((data.chunk_ids_preview||[]).join("\n"))}</div></div>`,detailModal.classList.remove("hidden"),detailModal.classList.add("flex")}catch(err){setUploadStatus(`获取详情失败：${err.message}`,"error")}}function replaceFile(encodedFilename){const filename=decodeURIComponent(encodedFilename),input=document.createElement("input");input.type="file",input.accept=".pdf,.docx,.md,.txt",input.onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;if(file.name!==filename){const ok=confirm(`当前选择文件名为「${file.name}」，系统会按新文件名新增而不是替换。\n要继续吗？\n\n想替换更新，请尽量选择同名文件「${filename}」。`);if(!ok)return}await uploadFile(file)},input.click()}dropZone.addEventListener("click",()=>fileInput.click()),fileInput.addEventListener("change",e=>{selectedFile=e.target.files[0]||null,updateSelectedFileUI()}),["dragenter","dragover"].forEach(name=>dropZone.addEventListener(name,e=>{e.preventDefault(),dropZone.classList.add("border-blue-600","bg-blue-50")})),["dragleave","drop"].forEach(name=>dropZone.addEventListener(name,e=>{e.preventDefault(),dropZone.classList.remove("border-blue-600","bg-blue-50")})),dropZone.addEventListener("drop",e=>{const files=e.dataTransfer.files;files&&files.length>0&&(selectedFile=files[0],updateSelectedFileUI())}),uploadBtn.addEventListener("click",()=>uploadFile()),refreshFilesBtn.addEventListener("click",loadFiles),addCategoryBtn.addEventListener("click",addCategory),closeDetailBtn.addEventListener("click",()=>{detailModal.classList.add("hidden"),detailModal.classList.remove("flex")}),detailModal.addEventListener("click",e=>{e.target===detailModal&&(detailModal.classList.add("hidden"),detailModal.classList.remove("flex"))}),window.deleteOneFile=deleteOneFile,window.downloadFile=downloadFile,window.showDetail=showDetail,window.replaceFile=replaceFile,window.deleteCategory=deleteCategory,loadCategories(),loadFiles();
</script></body></html>
